<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Přehled agentů</title>
<style>
:root{--bg:#0f1218;--panel:#161b24;--track:#1a1f29;--line:#2a303c;--text:#e2e8f0;--muted:#7d8798;--soft:#aeb8c6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,Segoe UI,sans-serif;padding:20px}
.wrap{max-width:1000px;margin:0 auto}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
#clk{font:500 34px ui-monospace,Consolas,monospace;letter-spacing:1px}
#sum{color:var(--muted);flex:1;min-width:180px}
select,button{background:transparent;color:var(--text);border:1px solid #3a4250;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
select option{background:#161b24}
.row{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:12px;margin:9px 0}
.nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{position:relative;height:24px;background:var(--track);border-radius:6px;overflow:hidden}
.seg{position:absolute;top:0;bottom:0;opacity:.88;min-width:2px}
.seg.run{opacity:1;border-right:2px solid #fff}
.axis{position:relative;height:18px;margin:2px 0 14px 182px;border-top:1px solid var(--line)}
.axis span{position:absolute;top:3px;transform:translateX(-50%);font-size:11px;color:#6b7586}
h2{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:18px 0 6px}
#log{font:12.5px/1.8 ui-monospace,Consolas,monospace;min-height:100px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.foot{margin-top:20px;color:#5a6474;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#3a4250}
.dot.ok{background:#34d399}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span id="clk">00:00:00</span>
  <span id="sum"></span>
  <select id="rng" aria-label="Rozsah">
    <option value="day">Dnes</option>
    <option value="1h">Poslední hodina</option>
    <option value="all">Celá historie</option>
  </select>
</header>
<div id="rows"></div>
<div class="axis" id="axis"></div>
<h2>Události</h2>
<div id="log"></div>
<div class="foot"><span class="dot" id="dot"></span><span id="conn">připojování…</span> · zdroj: CAS.csv, obnova každé 2 s</div>
</div>
<script>
const PAL=['#5aa6f0','#34d399','#fbbf24','#a78bfa','#f472b6','#fb923c','#22d3ee','#a3e635'];
const FIX={hlavni:0,pwa:1,db:2,test:3,release:4,uzivatel:5};
const colOf=n=>PAL[n in FIX?FIX[n]:[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const $=id=>document.getElementById(id);
let data=[];
function parseCsv(t){
  const rows=[];let r=[],f='',q=false;
  t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===';'){r.push(f);f=''}
    else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}
    else if(c!=='\r')f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows.filter(x=>x.length>=5&&x[0]!=='zacatek');
}
const pd=s=>{const m=/^(\d+)-(\d+)-(\d+) (\d+):(\d+):(\d+)$/.exec(s||'');return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime():null};
const hms=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const hm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  try{
    const r=await fetch('/cas.csv',{cache:'no-store'});
    data=parseCsv(await r.text()).map(x=>({z:pd(x[0]),k:pd(x[1]),agent:x[3]||'hlavni',ukol:x[4]||''})).filter(x=>x.z);
    $('dot').className='dot ok';$('conn').textContent='připojeno';
  }catch(e){$('dot').className='dot';$('conn').textContent='server neodpovídá'}
}
function render(){
  const now=Date.now();
  $('clk').textContent=hm(now);
  const mode=$('rng').value;
  const d0=new Date();d0.setHours(0,0,0,0);
  let seg=data;
  if(mode==='day')seg=data.filter(x=>(x.k||now)>=d0.getTime());
  if(mode==='1h')seg=data.filter(x=>(x.k||now)>=now-3600000);
  if(!seg.length){$('rows').innerHTML='<div class="empty">Zatím žádný zapsaný úsek. Agent zapíše start příkazem <code>.\\cas.ps1 start "úkol" agent</code>.</div>';$('axis').innerHTML='';$('log').innerHTML='';$('sum').textContent='';return}
  let t0=mode==='1h'?now-3600000:Math.min(...seg.map(x=>x.z));
  const t1=Math.max(now,...seg.map(x=>x.k||0));
  const span=Math.max(t1-t0,60000),pad=span*0.02;t0-=pad*(mode==='1h'?0:1);const sp=t1+pad-t0;
  const pct=t=>Math.min(100,Math.max(0,(t-t0)/sp*100));
  const agents=[...new Set(seg.map(x=>x.agent))].sort();
  let run=0;
  $('rows').innerHTML=agents.map(a=>{
    const mine=seg.filter(x=>x.agent===a),open=mine.filter(x=>!x.k).slice(-1)[0];
    if(open)run++;
    const last=mine.slice().sort((p,q)=>(q.k||now)-(p.k||now))[0];
    const col=colOf(a);
    const st=open?'<span style="color:'+col+'">běží: '+esc(open.ukol)+'…</span>':'hotovo: '+esc(last.ukol);
    return '<div class="row"><div><div class="nm">'+esc(a)+'</div><div class="st">'+st+'</div></div><div class="tr">'+
      mine.map(x=>{const l=pct(x.z),w=Math.max(0.15,pct(x.k||now)-l);return '<div class="seg'+(x.k?'':' run')+'" title="'+esc(x.ukol)+'" style="left:'+l+'%;width:'+w+'%;background:'+col+'"></div>'}).join('')+'</div></div>';
  }).join('');
  const n=6;$('axis').innerHTML=Array.from({length:n+1},(_,i)=>{const t=t0+sp*i/n;return '<span style="left:'+i/n*100+'%">'+hm(t).slice(0,sp<600000?8:5)+'</span>'}).join('');
  const ev=[];seg.forEach(x=>{ev.push([x.z,x,'začal: '+x.ukol]);if(x.k)ev.push([x.k,x,'dokončil: '+x.ukol+' ('+hms(x.k-x.z)+')'])});
  ev.sort((p,q)=>p[0]-q[0]);
  $('log').innerHTML=ev.slice(-8).map(e=>'<div><span style="color:#6b7586">'+hm(e[0])+'</span>  <span style="color:'+colOf(e[1].agent)+'">'+esc(e[1].agent)+'</span> <span style="color:var(--soft)">'+esc(e[2])+'</span></div>').join('');
  const work=seg.reduce((s,x)=>s+((x.k||now)-x.z),0);
  $('sum').textContent='běží '+run+' z '+agents.length+'  ·  součet práce agentů '+hms(work);
}
$('rng').onchange=render;
load().then(render);
setInterval(()=>load(),2000);
setInterval(render,500);
</script>
</body>
</html>
